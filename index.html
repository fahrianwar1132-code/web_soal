<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Quiz - SMK</title>
    <!-- FontAwesome untuk Icon Desktop/Mobile/Tema -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================
            TEMA WARNA (DEFAULT: GELAP DI DALAM HP)
        ========================= */
        :root {
            --phone-bg: #0b0f19;
            --screen-bg: linear-gradient(135deg, #080b18, #11152b);
            --card-bg: rgba(21, 25, 47, 0.98);
            --text-color: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2b304c;
            --option-bg: #1b1f38;
            --score-bg: #181c35;
        }

        /* TEMA TERANG (LIGHT MODE DI DALAM HP) */
        [data-theme="light"] {
            --phone-bg: #ffffff;
            --screen-bg: linear-gradient(135deg, #f8fafc, #e2e8f0);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --option-bg: #f8fafc;
            --score-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        /* Bagian luar HP SETERUSNYA PUTIH KOSONG */
        body {
            background: #ffffff !important;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* =========================
            TOMBOL SWITCHER DI LUAR
        ========================= */
        .device-switcher {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            padding: 6px;
            border-radius: 9999px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .device-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: auto;
            margin-top: 0;
        }

        .device-btn.active {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .device-btn:hover:not(.active) {
            color: #1e293b;
        }

        /* =========================
            BINGKAI HP
        ========================= */
        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 840px;
            background: var(--phone-bg);
            border: 12px solid #0b0f19;
            border-radius: 44px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: max-width 0.3s ease;
        }

        .phone-frame.desktop-mode {
            max-width: 820px;
        }

        .dynamic-island-container {
            width: 100%;
            height: 40px;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1000;
            flex-shrink: 0;
            padding-top: 8px;
        }

        .dynamic-island {
            width: 120px;
            height: 28px;
            background: #000000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .camera-lens {
            width: 11px;
            height: 11px;
            background: #0d1322;
            border: 2px solid #1c233a;
            border-radius: 50%;
        }

        .sensor-dot {
            width: 7px;
            height: 7px;
            background: #0d1322;
            border: 1px solid #1c233a;
            border-radius: 50%;
        }

        .phone-screen {
            width: 100%;
            height: calc(100% - 40px);
            overflow-y: auto;
            padding: 15px;
            background: var(--screen-bg);
        }

        .phone-screen::-webkit-scrollbar {
            width: 5px;
        }
        .phone-screen::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
        }

        /* =========================
            HEADER & KONTROL TEMA
        ========================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-smk {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: white;
            border-radius: 14px;
            padding: 5px;
        }

        .brand h1 {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 11px;
        }

        .user-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            width: fit-content;
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .theme-toggle-btn {
            background: var(--score-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            margin-top: 0;
            padding: 0;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .score-box {
            background: var(--score-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 12px;
            text-align: center;
            min-width: 65px;
        }

        .score-box small {
            display: block;
            color: var(--text-muted);
            font-size: 9px;
        }

        .score-box strong {
            display: block;
            color: #a78bfa;
            font-size: 18px;
            margin-top: 2px;
        }

        /* =========================
            PROGRESS & CARD (DENGAN ANIMASI TRANSISI HALUS)
        ========================= */
        .progress-info {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--score-bg);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.3s ease;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            
            /* Efek Animasi Transisi Halus */
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Saat Card disembunyikan pakai animasi naik & pudar */
        .card.hidden {
            display: block !important; /* Biar transisinya sempat terbaca */
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            border: none;
            padding: 0;
            margin: 0;
        }

        .label {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #question {
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        /* =========================
            FORM LOGIN & CAPTCHA
        ========================= */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--score-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #6366f1;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--option-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .captcha-question {
            font-size: 16px;
            font-weight: bold;
            color: #a78bfa;
            letter-spacing: 1px;
        }

        .refresh-captcha {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
            margin-top: 0;
        }

        /* =========================
            PILIHAN JAWABAN
        ========================= */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option {
            background: var(--option-bg);
            border: 1px solid var(--border-color);
            border-radius: 13px;
            padding: 15px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: #8b5cf6;
        }

        .option.correct {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #22c55e;
        }

        .option.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #ef4444;
        }

        .option.disabled {
            pointer-events: none;
        }

        .letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            background: var(--border-color);
            border-radius: 8px;
            margin-right: 10px;
            font-weight: bold;
            flex-shrink: 0;
        }

        #feedback {
            min-height: 25px;
            margin-top: 15px;
            font-weight: bold;
        }

        .correct-text { color: #22c55e; }
        .wrong-text { color: #ef4444; }

        /* =========================
            BUTTON
        ========================= */
        button {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 15px;
            border-radius: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* =========================
            HASIL
        ========================= */
        .result { text-align: center; }
        .trophy { font-size: 60px; margin-bottom: 10px; }
        
        .final-score strong {
            font-size: 50px;
            color: #a78bfa;
        }

        .percentage {
            background: var(--option-bg);
            padding: 14px;
            border-radius: 12px;
            color: var(--text-muted);
            margin: 15px 0;
        }
        .percentage strong {
            display: block;
            color: #a78bfa;
            font-size: 22px;
            margin-top: 3px;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 15px;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- TOMBOL SWITCHER DI LUAR -->
    <div class="device-switcher">
        <button class="device-btn" id="desktopBtn" onclick="switchDevice('desktop')">
            <i class="fas fa-desktop"></i> Desktop
        </button>
        <button class="device-btn active" id="mobileBtn" onclick="switchDevice('mobile')">
            <i class="fas fa-mobile-alt"></i> Mobile
        </button>
    </div>

    <!-- BINGKAI HP -->
    <div class="phone-frame" id="phoneFrame">
        <!-- DYNAMIC ISLAND -->
        <div class="dynamic-island-container">
            <div class="dynamic-island">
                <div class="sensor-dot"></div>
                <div class="camera-lens"></div>
            </div>
        </div>

        <div class="phone-screen">
            <div class="container">

                <!-- HEADER -->
                <div class="header">
                    <div class="brand">
                        <img src="logo-tm.png" class="logo-smk" alt="Logo SMK">
                        <div>
                            <h1>Kuis Koding & AI</h1>
                            <p>SMK Tunas Media</p>
                            <div class="user-badge" id="userHeaderBadge">
                                <i class="fas fa-user-circle"></i> <span id="headerUserName">Budi Santoso</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="header-actions">
                        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Ganti Tema">
                            <i class="fas fa-sun" id="themeIcon"></i>
                        </button>
                        
                        <div class="score-box" id="scoreBoxContainer">
                            <small>SKOR</small>
                            <strong id="score">0</strong>
                        </div>
                    </div>
                </div>

                <!-- PROGRESS BAR -->
                <div class="progress-info" id="progressInfo">
                    <span id="questionNumber">Pertanyaan 1 dari 10</span>
                    <span id="percent">0%</span>
                </div>
                <div class="progress-bar" id="progressBarContainer">
                    <div class="progress" id="progress"></div>
                </div>

                <!-- ================= CARD LOGIN / IDENTITAS ================= -->
                <div class="card" id="loginCard">
                    <div class="label">🔐 VERIFIKASI PESERTA</div>
                    <h2>Silakan isi data diri & verifikasi AI</h2>
                    
                    <div class="form-group" style="margin-top: 20px;">
                        <label>Nama Lengkap</label>
                        <input type="text" id="inputName" placeholder="Contoh: Budi Santoso">
                    </div>

                    <div class="form-group">
                        <label>Kelas</label>
                        <input type="text" id="inputClass" placeholder="Contoh: XI RPL 1">
                    </div>

                    <div class="form-group">
                        <label>Verifikasi Captcha AI (Matematika)</label>
                        <div class="captcha-box">
                            <span class="captcha-question" id="captchaQuestion">6 + 6 = ?</span>
                            <button type="button" class="refresh-captcha" onclick="generateCaptcha()"><i class="fas fa-sync-alt"></i></button>
                        </div>
                        <input type="number" id="inputCaptcha" placeholder="Masukkan jawaban angka">
                    </div>

                    <button id="startQuizButton" onclick="startQuiz()">Mulai Kuis 🚀</button>
                </div>

                <!-- ================= CARD KUIS ================= -->
                <div class="card hidden" id="quizCard">
                    <div class="label">🧠 PERTANYAAN</div>
                    <h2 id="question"></h2>
                    <div class="options" id="options"></div>
                    <div id="feedback"></div>
                    <button id="nextButton" disabled>Jawab & Lanjut →</button>
                </div>

                <!-- ================= CARD HASIL ================= -->
                <div class="card result hidden" id="resultCard">
                    <div class="trophy">🏆</div>
                    <h2>Kuis Selesai!</h2>
                    <p id="participantInfo" style="color: #38bdf8; margin-bottom: 15px; font-weight: bold;"></p>
                    <div class="final-score">
                        <strong id="finalScore">0</strong><span> / 10</span>
                    </div>
                    <div class="percentage">
                        Persentase Benar
                        <strong id="finalPercent">0%</strong>
                    </div>
                    <p id="resultMessage">Terus belajar dan tingkatkan kemampuanmu!</p>
                    <button id="restartButton">🔄 Ulangi Kuis</button>
                </div>

                <footer>
                    @AI Coding Quiz • SMK TUNAS MEDIA
                </footer>

            </div>
        </div>
    </div>

    <script>
        const rawQuestions = [
            { question: "Bahasa pemrograman manakah yang sering digunakan untuk membuat aplikasi web dan mobile?", options: ["Java", "Python", "C#", "JavaScript"], answer: "D" },
            { question: "Apa kepanjangan dari RAM?", options: ["Random Access Memory", "Read Only Memory", "Remote Access Module", "Rapid Application Management"], answer: "A" },
            { question: "Bidang AI yang berfokus pada komputer yang dapat 'belajar' dari data disebut apa?", options: ["Data Science", "Machine Learning", "Web Development", "Cybersecurity"], answer: "B" },
            { question: "Dalam pemrograman, apa yang digunakan untuk menyimpan nilai sementara?", options: ["Function", "Loop", "Variable", "Class"], answer: "C" },
            { question: "Pernyataan manakah yang benar tentang Artificial Intelligence (AI)?", options: ["AI adalah teknologi yang hanya ada di film fiksi ilmiah.", "AI adalah simulasi kecerdasan manusia dalam mesin.", "AI hanya bisa dilakukan oleh robot.", "AI tidak memiliki dampak pada kehidupan sehari-hari."], answer: "B" },
            { question: "Sistem operasi manakah yang paling umum digunakan pada komputer pribadi?", options: ["Linux", "macOS", "Windows", "Android"], answer: "C" },
            { question: "Apa tujuan utama dari proses 'debugging' dalam pemrograman?", options: ["Menulis kode baru.", "Menemukan dan memperbaiki kesalahan kode.", "Mendesain antarmuka pengguna.", "Mengkompilasi kode."], answer: "B" },
            { question: "Jika Anda ingin mengulang suatu tindakan beberapa kali dalam kode, Anda akan menggunakan apa?", options: ["If statement", "Function call", "Loop", "Variable declaration"], answer: "C" },
            { question: "Apa nama perangkat lunak yang membantu Anda mengelola file dan folder di komputer Anda?", options: ["Web browser", "Text editor", "File explorer", "Spreadsheet software"], answer: "C" },
            { question: "Apa yang dilakukan oleh 'chatbot' yang digerakkan oleh AI?", options: ["Bermain game.", "Melakukan percakapan seperti manusia.", "Memasak makanan.", "Menggambar gambar."], answer: "B" }
        ];

        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let correctAnswerA;

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeIcon.className = 'fas fa-moon';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fas fa-sun';
            }
        }

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswerA = num1 + num2;
            document.getElementById("captchaQuestion").textContent = `${num1} + ${num2} = ?`;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function switchDevice(mode) {
            const frame = document.getElementById('phoneFrame');
            const desktopBtn = document.getElementById('desktopBtn');
            const mobileBtn = document.getElementById('mobileBtn');

            if (mode === 'desktop') {
                frame.classList.add('desktop-mode');
                desktopBtn.classList.add('active');
                mobileBtn.classList.remove('active');
            } else {
                frame.classList.remove('desktop-mode');
                mobileBtn.classList.add('active');
                desktopBtn.classList.remove('active');
            }
        }

        function startQuiz() {
            const name = document.getElementById("inputName").value.trim();
            const className = document.getElementById("inputClass").value.trim();
            const captchaInput = parseInt(document.getElementById("inputCaptcha").value);

            if (!name || !className) {
                alert("Harap isi Nama Lengkap dan Kelas terlebih dahulu!");
                return;
            }
            if (isNaN(captchaInput) || captchaInput !== correctAnswerA) {
                alert("Jawaban Captcha AI salah! Silakan coba lagi.");
                generateCaptcha();
                document.getElementById("inputCaptcha").value = "";
                return;
            }

            document.getElementById("headerUserName").textContent = `${name} (${className})`;
            document.getElementById("userHeaderBadge").style.display = "inline-flex";

            questions = shuffleArray(rawQuestions);

            const loginCard = document.getElementById("loginCard");
            const quizCard = document.getElementById("quizCard");

            // Efek Animasi Transisi Halus (Fade & Slide)
            loginCard.classList.add("hidden");
            quizCard.classList.remove("hidden");

            document.getElementById("scoreBoxContainer").style.display = "block";
            document.getElementById("progressInfo").style.display = "flex";
            document.getElementById("progressBarContainer").style.display = "block";

            currentQuestion = 0;
            score = 0;
            document.getElementById("score").textContent = "0";
            showQuestion();
        }

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const nextButton = document.getElementById("nextButton");
        const scoreElement = document.getElementById("score");
        const questionNumberElement = document.getElementById("questionNumber");
        const progressElement = document.getElementById("progress");
        const percentElement = document.getElementById("percent");
        const feedbackElement = document.getElementById("feedback");
        const quizCard = document.getElementById("quizCard");
        const resultCard = document.getElementById("resultCard");
        const finalScoreElement = document.getElementById("finalScore");
        const finalPercentElement = document.getElementById("finalPercent");
        const resultMessageElement = document.getElementById("resultMessage");
        const restartButton = document.getElementById("restartButton");

        function showQuestion() {
            answered = false;
            const current = questions[currentQuestion];
            questionElement.textContent = current.question;
            optionsElement.innerHTML = "";
            feedbackElement.textContent = "";
            feedbackElement.className = "";
            nextButton.disabled = true;

            questionNumberElement.textContent = "Pertanyaan " + (currentQuestion + 1) + " dari " + questions.length;
            const progressValue = (currentQuestion / questions.length) * 100;
            progressElement.style.width = progressValue + "%";
            percentElement.textContent = Math.round(progressValue) + "%";

            let optionsWithOriginal = current.options.map((opt, idx) => ({ text: opt, isCorrect: opt === current.options[getIdxFromLetter(current.answer)] }));
            let shuffledOptions = shuffleArray(optionsWithOriginal);

            const letters = ["A", "B", "C", "D"];
            for (let i = 0; i < shuffledOptions.length; i++) {
                const optionElement = document.createElement("div");
                optionElement.className = "option";
                optionElement.innerHTML = '<span class="letter">' + letters[i] + '</span>' + shuffledOptions[i].text;
                
                optionElement.addEventListener("click", function() {
                    selectAnswer(shuffledOptions[i].isCorrect, optionElement, shuffledOptions);
                });
                optionsElement.appendChild(optionElement);
            }
        }

        function getIdxFromLetter(letter) {
            if (letter === "A") return 0;
            if (letter === "B") return 1;
            if (letter === "C") return 2;
            return 3;
        }

        function selectAnswer(isCorrect, selectedElement, shuffledOptions) {
            if (answered) return;
            answered = true;

            const allOptions = document.querySelectorAll(".option");
            allOptions.forEach(opt => opt.classList.add("disabled"));

            if (isCorrect) {
                selectedElement.classList.add("correct");
                feedbackElement.textContent = "✓ Benar! Jawaban kamu tepat.";
                feedbackElement.className = "correct-text";
                score++;
                scoreElement.textContent = score;
            } else {
                selectedElement.classList.add("wrong");
                feedbackElement.textContent = "✕ Salah!";
                feedbackElement.className = "wrong-text";

                allOptions.forEach((opt, idx) => {
                    if (shuffledOptions[idx].isCorrect) {
                        opt.classList.add("correct");
                    }
                });
            }
            nextButton.disabled = false;
        }

        nextButton.addEventListener("click", function() {
            if (!answered) return;
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            quizCard.classList.add("hidden");
            resultCard.classList.remove("hidden");

            document.getElementById("scoreBoxContainer").style.display = "none";
            document.getElementById("progressInfo").style.display = "none";
            document.getElementById("progressBarContainer").style.display = "none";

            const name = document.getElementById("inputName").value;
            const className = document.getElementById("inputClass").value;
            document.getElementById("participantInfo").textContent = `${name} (${className})`;

            finalScoreElement.textContent = score;
            const percentage = (score / questions.length) * 100;
            finalPercentElement.textContent = Math.round(percentage) + "%";

            if (percentage === 100) {
                resultMessageElement.textContent = "🔥 Sempurna! Kamu sangat jago coding dan AI!";
            } else if (percentage >= 80) {
                resultMessageElement.textContent = "🚀 Keren! Pengetahuan kamu sangat bagus!";
            } else if (percentage >= 60) {
                resultMessageElement.textContent = "👍 Bagus! Terus tingkatkan kemampuanmu!";
            } else {
                resultMessageElement.textContent = "📚 Jangan menyerah! Belajar lagi dan coba kembali.";
            }
        }

        restartButton.addEventListener("click", function() {
            document.getElementById("inputName").value = "";
            document.getElementById("inputClass").value = "";
            document.getElementById("inputCaptcha").value = "";
            document.getElementById("userHeaderBadge").style.display = "none";
            generateCaptcha();

            resultCard.classList.add("hidden");
            loginCard.classList.remove("hidden");
        });

        generateCaptcha();
    </script>
</body>
</html>
